<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#2563eb">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">

    <title>Games Interaktif SMK Pintar</title>
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="game-header">
        <h1>🎮 SMK PINTAR</h1>

        <div class="score-area">
            <span>⭐ Skor:</span>
            <strong id="score">0</strong>
        </div>
    </header>


    <!-- MENU UTAMA -->
    <section id="home-screen" class="screen active">

        <div class="game-card">

            <h2>GAMES INTERAKTIF</h2>

            <p>
                Belajar sambil bermain dengan berbagai
                tantangan menarik.
            </p>

            <button
                class="main-button"
                onclick="startGame()"
            >
                ▶ MULAI GAME
            </button>

        </div>

    </section>


    <!-- GAME -->
    <section id="game-screen" class="screen">

        <div class="level-info">
            <span>
                Level <strong id="level">1</strong>
            </span>

            <span>
                ❤️ <strong id="lives">3</strong>
            </span>
        </div>


        <div id="game-container">

            <div id="question-container">

                <h2 id="question">
                    Pertanyaan akan muncul di sini
                </h2>

                <div
                    id="answers"
                    class="answers"
                ></div>

            </div>

        </div>


        <!-- MOBILE CONTROL -->
        <div
            id="mobile-controls"
            class="mobile-controls"
        >

            <button
                class="control-button"
                id="btn-left"
            >
                ◀
            </button>

            <button
                class="control-button"
                id="btn-jump"
            >
                ▲
            </button>

            <button
                class="control-button"
                id="btn-right"
            >
                ▶
            </button>

        </div>


        <div class="game-actions">

            <button
                class="secondary-button"
                onclick="pauseGame()"
            >
                ⏸ Pause
            </button>

            <button
                class="secondary-button"
                onclick="exitGame()"
            >
                🏠 Keluar
            </button>

        </div>

    </section>


    <!-- HASIL -->
    <section id="result-screen" class="screen">

        <div class="game-card">

            <h2>🎉 GAME SELESAI!</h2>

            <p>Skor Kamu:</p>

            <div
                id="final-score"
                class="final-score"
            >
                0
            </div>

            <button
                class="main-button"
                onclick="startGame()"
            >
                🔄 MAIN LAGI
            </button>

            <button
                class="secondary-button"
                onclick="showHome()"
            >
                🏠 MENU UTAMA
            </button>

        </div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
